name: Collect listings

# Runs itself every night at 04:10 Irish time and opens a pull request with
# whatever it found. Nothing reaches the live site until Eddie merges it.
on:
  schedule:
    - cron: "10 3 * * *"   # 03:10 UTC — 04:10 Irish summer time
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single source (e.g. dolans)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Playwright is only needed here, for the venue sites that render
      # their listings with JavaScript. The site build itself stays dependency-free.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Collect
        run: node scripts/scrape.mjs ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}

      - name: Check what came back
        run: node scripts/check.mjs

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Listings update ${{ github.run_number }}"
          branch: listings/auto
          delete-branch: true
          title: "Listings update — ${{ github.run_number }}"
          body: |
            Automatic listings collection.

            Review before merging. Anything the collector wasn't confident about
            is marked `"status": "needs_review"` in `data/shows.json` and shows a
            warning banner on its page until you clear it.

            Check especially:
            - new shows with a `needs_review` status
            - prices or times that changed
            - anything from a third-party source rather than the venue's own site
          labels: listings
