name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — the generator is plain Node.
      - name: Check the data
        run: node scripts/check.mjs

      - name: Build the site
        run: node src/build.mjs
        env:
          SITE_URL: https://www.irishcomedyguide.ie

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
